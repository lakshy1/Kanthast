  <body>
    <!-- Boot loader: pure HTML/CSS, painted before any JavaScript or stylesheet loads.
         The K assembles inside a glass disc with a slow orbit ring; the wordmark rises
         letter by letter. utils/bootLoader.js keeps it until the intro has played
         (first load in a visit) and the page is ready, then lifts it away. -->
    <div id="boot-loader" role="status" aria-live="polite" aria-label="Loading Kanthast Professional">
      <style>
        #boot-loader { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; overflow: hidden;
          background: linear-gradient(180deg, #f3f6fd 0%, #eaf0fc 100%); transition: opacity 0.7s ease, visibility 0.7s ease; }
        #boot-loader::before, #boot-loader::after { content: ""; position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(60px); opacity: 0.55; }
        #boot-loader::before { background: #bcd2ff; top: -14vmax; right: -10vmax; animation: bl-drift 9s ease-in-out infinite alternate; }
        #boot-loader::after { background: #dfe9ff; bottom: -18vmax; left: -12vmax; animation: bl-drift 11s ease-in-out infinite alternate-reverse; }
        #boot-loader .bl-card { position: relative; z-index: 1; display: grid; justify-items: center; gap: 18px; transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
        #boot-loader.is-done { opacity: 0; visibility: hidden; }
        #boot-loader.is-done .bl-card { transform: translateY(-14px) scale(1.04); }
        #boot-loader .bl-disc { position: relative; display: grid; place-items: center; width: 132px; height: 132px; border-radius: 50%;
          background: rgba(255, 255, 255, 0.72); box-shadow: 0 24px 60px -24px rgba(30, 58, 138, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.9);
          backdrop-filter: blur(8px); opacity: 0; transform: scale(0.86); animation: bl-pop 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards; }
        #boot-loader .bl-ring { position: absolute; inset: -7px; border-radius: 50%;
          background: conic-gradient(from 0deg, rgba(29, 78, 216, 0) 0deg, rgba(59, 130, 246, 0.15) 120deg, #1d4ed8 300deg, rgba(29, 78, 216, 0) 360deg);
          -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
          opacity: 0; animation: bl-fade 0.6s ease 0.9s forwards, bl-spin 2.6s linear 0.9s infinite; }
        #boot-loader .bl-k { width: 62px; height: 62px; overflow: visible; }
        #boot-loader .bl-k * { transform-box: fill-box; }
        #boot-loader .bl-stem { transform-origin: 50% 100%; transform: scaleY(0); animation: bl-grow 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards; }
        #boot-loader .bl-up { opacity: 0; transform: translate(-9px, 9px); animation: bl-arm 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards; }
        #boot-loader .bl-down { opacity: 0; transform: translate(-9px, -9px); animation: bl-arm 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.95s forwards; }
        #boot-loader .bl-word { display: flex; font: 800 30px/1.1 "Plus Jakarta Sans", Inter, system-ui, sans-serif; letter-spacing: -0.025em; color: #0b1530; }
        #boot-loader .bl-word span { display: inline-block; opacity: 0; transform: translateY(10px);
          animation: bl-rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: calc(1.1s + var(--i) * 0.045s); }
        #boot-loader .bl-pill { margin-top: -6px; padding: 5px 14px; border-radius: 999px; font: 700 13px/1.2 "Plus Jakarta Sans", Inter, system-ui, sans-serif;
          letter-spacing: 0.02em; opacity: 0; animation: bl-fade 0.5s ease 1.5s forwards; }
        #boot-loader .bl-tag { font: 500 14px/1.4 Inter, system-ui, sans-serif; color: #5b6880; opacity: 0; animation: bl-fade 0.6s ease 1.6s forwards; }
        @keyframes bl-pop { to { opacity: 1; transform: scale(1); } }
        @keyframes bl-fade { to { opacity: 1; } }
        @keyframes bl-grow { to { transform: scaleY(1); } }
        @keyframes bl-arm { to { opacity: 1; transform: translate(0, 0); } }
        @keyframes bl-rise { to { opacity: 1; transform: translateY(0); } }
        @keyframes bl-spin { to { transform: rotate(360deg); } }
        @keyframes bl-drift { to { transform: translate(-4vmax, 3vmax) scale(1.08); } }
        #boot-loader.is-quick * { animation-delay: 0s !important; animation-duration: 0.35s !important; }
        #boot-loader.is-quick .bl-ring { animation: bl-fade 0.3s ease forwards, bl-spin 2.6s linear infinite !important; }
        @media (prefers-reduced-motion: reduce) {
          #boot-loader *, #boot-loader::before, #boot-loader::after { animation-duration: 0.01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
          #boot-loader .bl-ring { display: none; }
          #boot-loader.is-done .bl-card { transform: none; }
        }
      </style>
