<title>Kanthast Roadmap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a working tool. Compact header, then one wide timeline with a sliding week window; notes below. Hairlines, no cards. */
:root{
  --bg:#f7f7f5; --surface:#ffffff; --ink:#1b1a17; --muted:#69665f; --line:#e3e1da; --soft:#eeece6;
  --accent:#a8540a; --bar:#b9b5aa; --ok:#2f7d55; --warn:#b06a00; --bad:#b3372e;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151513; --surface:#1d1c1a; --ink:#edebe6; --muted:#a09c93; --line:#32302c; --soft:#262522;
    --accent:#f0b35a; --bar:#5d5a52; --ok:#5fbf8c; --warn:#e3a53f; --bad:#ee7b70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151513; --surface:#1d1c1a; --ink:#edebe6; --muted:#a09c93; --line:#32302c; --soft:#262522;
  --accent:#f0b35a; --bar:#5d5a52; --ok:#5fbf8c; --warn:#e3a53f; --bad:#ee7b70; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px}
#app{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-size:24px;line-height:1.25;font-weight:600;letter-spacing:-.02em;margin:0}
h2{font-size:16px;font-weight:600;margin:0}
p{margin:0}
.lede{max-width:78ch;color:var(--ink)}
.muted{color:var(--muted)}
section{display:flex;flex-direction:column;gap:12px}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--muted);align-items:center}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.meter{width:140px;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.bar-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.grp{display:flex;gap:4px;align-items:center}
.btn{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,input,textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
textarea{width:100%;min-width:220px;resize:vertical}
label.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.gscroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.gantt{min-width:820px}
.grow{display:grid;grid-template-columns:300px 1fr;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.ghead{position:sticky;top:0}
.ghead .weeks{display:flex}
.ghead .weeks span{flex:1;min-width:0;font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:6px 0 6px 4px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.lane{grid-column:1/-1;padding:9px 12px 7px;background:var(--bg);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.rowbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:8px;padding:7px 10px 7px 12px;min-width:0;width:100%;align-items:flex-start}
.rowbtn:hover{background:var(--soft)}
.rowbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.caret{font-family:var(--mono);font-size:11px;color:var(--muted);width:10px;flex:none;padding-top:2px}
.rt{min-width:0;display:flex;flex-direction:column;gap:1px}
.rt b{font-weight:500;font-size:13px;overflow-wrap:anywhere}
.rt small{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:11px;border-radius:4px;padding:0 5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.doing{color:var(--ink);border-color:var(--ink)}
.chip.done{color:var(--ok);border-color:var(--ok)}
.chip.blocked{color:var(--bad);border-color:var(--bad)}
.chip.late{color:var(--warn);border-color:var(--warn)}
.track{position:relative;overflow:hidden;min-height:38px;border-left:1px solid var(--line);
  background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100% / var(--span)) 100%;background-position:-1px 0}
.track::after{content:"";position:absolute;top:0;bottom:0;left:var(--today);width:2px;background:var(--accent);opacity:.8}
.gbar{position:absolute;top:11px;height:16px;border-radius:4px;background:var(--bar)}
.gbar.doing{background:var(--ink)}
.gbar.done{background:var(--ok)}
.gbar.blocked{background:var(--bad)}
.gbar.late{outline:2px dashed var(--warn);outline-offset:1px}
.gms{position:absolute;top:12px;width:13px;height:13px;margin-left:-6px;transform:rotate(45deg);background:var(--surface);border:2px solid var(--ink);border-radius:2px}
.gms.done{background:var(--ok);border-color:var(--ok)}
.gms.late{border-color:var(--warn)}
.off{position:absolute;top:9px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.detail{grid-column:1/-1;padding:12px 14px 14px 30px;background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 24px}
.f{display:flex;flex-direction:column;gap:1px;min-width:0}
.f.wide{grid-column:1/-1}
.f>span.k{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ed{position:relative;display:inline-flex;align-items:baseline;gap:6px;max-width:100%;min-width:0}
.ed.blk{display:flex}
.edv{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.edv.ph{color:var(--muted)}
.pen{all:unset;position:relative;cursor:pointer;flex:none;color:var(--muted);opacity:0;display:inline-flex;padding:2px;border-radius:4px;align-self:center}
.ed:hover>.pen,.pen:focus-visible{opacity:1}
.pen:hover{color:var(--ink);background:var(--soft)}
.pen:focus-visible{outline:2px solid var(--accent)}
.pen:hover::after,.pen:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:11px;line-height:1.4;padding:2px 7px;border-radius:4px;white-space:nowrap;pointer-events:none;z-index:5}
@media (hover:none){.pen{opacity:.6}}
.edf{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;width:100%}
.edf input[type=text]{flex:1;min-width:160px}
.eda{display:flex;gap:4px}
.list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.list li{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.x{all:unset;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:2px 5px;border-radius:4px;opacity:0;flex:none}
.list li:hover .x,.x:focus-visible{opacity:1}
.x:hover{color:var(--bad);background:var(--soft)}
.x:focus-visible{outline:2px solid var(--accent)}
@media (hover:none){.x{opacity:.6}}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px}
.cols section{min-width:0}
.sync{font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px}
@media (max-width:640px){.grow{grid-template-columns:200px 1fr}.detail{padding-left:14px}}
</style>

  var e=document.createElement(t),k;
  for(k in (a||{})){var v=a[k];
    if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.slice(0,2)==="on")e[k]=v;
    else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v)}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];
    if(Array.isArray(c))c.forEach(function(x){if(x!=null&&x!==false)e.append(x)});
    else if(c!=null&&c!==false)e.append(c)}
  return e;
}

/* Inline editing: hover shows a pencil; the pencil opens a field with Save and Discard. */
function ed(val,save,o){
  o=o||{};
  var w=h("span",{class:"ed"+(o.block?" blk":"")});
  function show(){
    var text=o.fmt?o.fmt(val):(val===""||val==null?(o.ph||"Add"):String(val));
    var pen=h("button",{class:"pen",type:"button","aria-label":"Edit "+(o.label||""),"data-tip":"Edit",html:PEN,onclick:function(e){e.stopPropagation();edit()}});
    w.replaceChildren(h("span",{class:"edv"+((val===""||val==null)?" ph":"")},text),pen);
  }
  function edit(){
    editing++;
    var inp;
    if(o.type==="select"){inp=h("select");o.options.forEach(function(op){var el=h("option",{value:op[0]},op[1]);if(op[0]===val)el.selected=true;inp.append(el)})}
    else if(o.multi){inp=h("textarea",{rows:3});inp.value=val||""}
    else{inp=h("input",{type:o.type||"text"});inp.value=val==null?"":val;if(o.type==="number"){inp.min=o.min||1;inp.style.width="80px"}}
    inp.id="ed-"+(o.id||"field");inp.setAttribute("aria-label",o.label||"Edit");
    function end(){editing=Math.max(0,editing-1)}
    function doSave(){
      var v=inp.value;
      if(o.type==="number"){v=Math.max(o.min||1,parseInt(v,10)||(o.min||1))}else{v=String(v).trim()}
      end();
      if((o.type==="date"||o.required)&&!v){show();flushPending();return}
      if(v!==val){save(v);commit()}else{show();flushPending()}
    }
    function doDiscard(){end();show();flushPending()}
    inp.onkeydown=function(e){
      if(e.key==="Escape"){e.preventDefault();doDiscard()}
      else if(e.key==="Enter"&&(!o.multi||e.metaKey||e.ctrlKey)){e.preventDefault();doSave()}
    };
    w.replaceChildren(h("span",{class:"edf"},inp,h("span",{class:"eda"},
      h("button",{class:"btn ink sm",type:"button",onclick:doSave},"Save"),
      h("button",{class:"btn sm",type:"button",onclick:doDiscard},"Discard"))));
    inp.focus();
  }
  show();return w;
}

function endOf(it){return it.ms?it.start:addDays(it.start,it.weeks*7)}
function isLate(it){return it.status!=="done"&&(it.ms?it.start<TODAY:endOf(it)<=TODAY)}
function later(it,oldEnd){return state.items.filter(function(o){return o!==it&&o.owner===it.owner&&o.status!=="done"&&o.start>=oldEnd})}
function moveStart(it,days){
  var L=ui.cascade?later(it,endOf(it)):[];
  it.start=addDays(it.start,days);L.forEach(function(o){o.start=addDays(o.start,days)});
}
function setWeeks(it,w,force){
  w=Math.max(1,w);
  var L=(ui.cascade||force)?later(it,endOf(it)):[],d=(w-it.weeks)*7;
  it.weeks=w;L.forEach(function(o){o.start=addDays(o.start,d)});
}
function weeksEarly(it){
  if(it.ms||it.status!=="done"||!it.done)return 0;
  return Math.min(it.weeks-1,Math.floor(diff(endOf(it),it.done)/7));
}
function byId(id){for(var i=0;i<state.items.length;i++)if(state.items[i].id===id)return state.items[i];return null}
function newId(){return "i"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36)}

function render(){
  editing=0;TODAY=todayIso();
  var app=document.getElementById("app");
  var old=app.querySelector(".gscroll"),sl=old?old.scrollLeft:0;
  app.replaceChildren(header(),tracker(),notes(),dataTools());
  var g=app.querySelector(".gscroll");if(g)g.scrollLeft=sl;
}

function header(){
  var work=state.items.filter(function(i){return !i.ms});
  var n=function(f){return work.filter(f).length};
  var tw=0,dw=0;work.forEach(function(i){tw+=i.weeks;if(i.status==="done")dw+=i.weeks});
  var pct=tw?Math.round(dw/tw*100):0;
  var first=state.items.reduce(function(a,i){return i.start<a?i.start:a},"9999"),last=state.items.reduce(function(a,i){var e=endOf(i);return e>a?e:a},"0000");
  return h("header",null,
    h("div",{class:"eyebrow"},"Kanthast · Development roadmap · "+(state.items.length?fmt(first)+" to "+fmt(addDays(last,-1)):"")),
    h("h1",null,ed(state.title,function(v){state.title=v},{label:"title",id:"title",required:true})),
    h("p",{class:"lede"},ed(state.summary,function(v){state.summary=v},{label:"summary",id:"summary",multi:true,block:true})),
    h("div",{class:"stats"},
      h("span",null,h("b",null,String(pct)+"%")," of planned work done"),
      h("span",{class:"meter","aria-hidden":"true"},h("i",{style:"width:"+pct+"%"})),
      h("span",null,h("b",null,String(n(function(i){return i.status==="done"})))," done"),
      h("span",null,h("b",null,String(n(function(i){return i.status==="doing"})))," in progress"),
      h("span",null,h("b",null,String(n(isLate)))," late"),
      h("span",null,h("b",null,String(n(function(i){return i.status==="blocked"})))," blocked"),
      h("span",null,h("b",null,String(work.length))," items")),
    h("div",{class:"sync",id:"sync"},syncText));
}

function tracker(){
  var span=ui.span,days=span*7,win=ui.win;
  function pos(d){return diff(d,win)/days*100}
  function nav(n){return function(){ui.win=addDays(ui.win,n*7);saveUi();render()}}
  var owners=[];state.items.forEach(function(i){if(i.owner&&owners.indexOf(i.owner)<0)owners.push(i.owner)});owners.sort();
  var first=state.items.reduce(function(a,i){return i.start<a?i.start:a},"9999");
  var ownerSel=h("select",{id:"f-owner","aria-label":"Show owner",onchange:function(){ui.owner=this.value;saveUi();render()}},
    h("option",{value:""},"Everyone"),owners.map(function(o){var e=h("option",{value:o},o);if(o===ui.owner)e.selected=true;return e}));
  var spanSel=h("select",{id:"f-span","aria-label":"Weeks shown",onchange:function(){ui.span=parseInt(this.value,10);saveUi();render()}},
    [8,12,16,26,52].map(function(s){var e=h("option",{value:s},s+" weeks");if(s===span)e.selected=true;return e}));
  var controls=h("div",{class:"bar-row"},
    h("div",{class:"grp"},
      h("button",{class:"btn",type:"button",id:"w-b4",onclick:nav(-4),"aria-label":"Back 4 weeks"},"« 4 wk"),
      h("button",{class:"btn",type:"button",id:"w-b1",onclick:nav(-1),"aria-label":"Back 1 week"},"‹ 1 wk"),
      h("button",{class:"btn",type:"button",id:"w-today",onclick:function(){ui.win=addDays(mondayOf(TODAY),-7);saveUi();render()}},"Today"),
      h("button",{class:"btn",type:"button",id:"w-start",onclick:function(){if(first!=="9999"){ui.win=mondayOf(first);saveUi();render()}}},"Plan start"),
      h("button",{class:"btn",type:"button",id:"w-f1",onclick:nav(1),"aria-label":"Forward 1 week"},"1 wk ›"),
      h("button",{class:"btn",type:"button",id:"w-f4",onclick:nav(4),"aria-label":"Forward 4 weeks"},"4 wk »")),
    h("span",{class:"muted"},fmt(win)+" to "+fmt(addDays(win,days-1))),
    spanSel,ownerSel,
    h("label",{class:"chk"},h("input",{type:"checkbox",id:"f-hide",checked:ui.hideDone,onchange:function(){ui.hideDone=this.checked;saveUi();render()}}),"Hide done"),
    h("label",{class:"chk"},h("input",{type:"checkbox",id:"f-cascade",checked:ui.cascade,onchange:function(){ui.cascade=this.checked;saveUi()}}),"Moving an item also moves the same owner's later items"));

  var tp=pos(TODAY)+ (1/days*50);
  var gantt=h("div",{class:"gantt",style:"--span:"+span+";--today:"+((tp<0||tp>100)?"-50%":tp+"%")});
  var weeks=h("div",{class:"weeks"});
  for(var i=0;i<span;i++){var step=span>26?4:span>16?2:1;weeks.append(h("span",null,(i%step)?"":fmt(addDays(win,i*7),true)))}
  gantt.append(h("div",{class:"grow ghead"},h("div",{style:"padding:6px 12px;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase"},"Item"),weeks));

  state.lanes.forEach(function(lane){
    var items=state.items.filter(function(i){return i.lane===lane.id&&(!ui.owner||i.owner===ui.owner)&&!(ui.hideDone&&i.status==="done")})
      .sort(function(a,b){return a.start<b.start?-1:a.start>b.start?1:(a.ms?1:0)-(b.ms?1:0)});
    gantt.append(h("div",{class:"grow"},h("div",{class:"lane"},
      ed(lane.name,function(v){lane.name=v},{label:"workstream name",id:"lane-"+lane.id,required:true}),
      h("button",{class:"btn sm",type:"button",onclick:function(){
        var it={id:newId(),lane:lane.id,title:"New item",owner:ui.owner||"Dev A",start:mondayOf(TODAY<win?win:TODAY),weeks:1,status:"todo",ms:false,note:"",done:""};
        state.items.push(it);ui.open[it.id]=true;saveUi();commit()}},"Add item"))));
    items.forEach(function(it){gantt.append(row(it,pos))});
  });
  gantt.append(h("div",{class:"grow"},h("div",{class:"lane",style:"border-bottom:0"},h("span",null,""),
    h("button",{class:"btn sm",type:"button",onclick:function(){state.lanes.push({id:newId(),name:"New workstream"});commit()}},"Add workstream"))));

  var legend=h("div",{class:"legend"},
    h("span",null,h("i",{style:"background:var(--bar)"}),"Not started"),
    h("span",null,h("i",{style:"background:var(--ink)"}),"In progress"),
    h("span",null,h("i",{style:"background:var(--ok)"}),"Done"),
    h("span",null,h("i",{style:"background:var(--bad)"}),"Blocked"),
    h("span",null,h("i",{style:"outline:2px dashed var(--warn);background:none"}),"Late"),
    h("span",null,h("i",{style:"width:9px;height:9px;transform:rotate(45deg);border:2px solid var(--ink);background:none"}),"Milestone"),
    h("span",null,h("i",{style:"width:2px;height:12px;background:var(--accent)"}),"Today"),
    h("span",null,"Click an item to see and edit its details."));
  return h("section",null,h("h2",null,"Timeline"),controls,h("div",{class:"gscroll"},gantt),legend);
}

function row(it,pos){
  var open=!!ui.open[it.id],late=isLate(it),end=endOf(it);
  var btn=h("button",{class:"rowbtn",type:"button","aria-expanded":open?"true":"false",onclick:function(){ui.open[it.id]=!open;saveUi();render()}},
    h("span",{class:"caret"},open?"▾":"▸"),
    h("span",{class:"rt"},h("b",null,it.title),
      h("small",null,it.owner||"No owner",h("span",{class:"chip "+it.status},it.ms?(it.status==="done"?"Reached":"Milestone"):sLabel(it.status)),late?h("span",{class:"chip late"},"Late"):null)));
  var track=h("div",{class:"track"});
  if(it.ms){
    var p=pos(it.start);
    if(p>=0&&p<=100)track.append(h("span",{class:"gms "+(it.status==="done"?"done":"")+(late?" late":""),style:"left:"+p+"%",title:it.title+" · "+fmt(it.start)}));
    else track.append(h("span",{class:"off",style:p<0?"left:6px":"right:6px"},p<0?"‹":"›"));
  }else{
    var a=pos(it.start),b=pos(end);
    if(b<=0)track.append(h("span",{class:"off",style:"left:6px"},"‹"));
    else if(a>=100)track.append(h("span",{class:"off",style:"right:6px"},"›"));
    else{a=Math.max(0,a);b=Math.min(100,b);
      track.append(h("span",{class:"gbar "+it.status+(late?" late":""),style:"left:calc("+a+"% + 2px);width:calc("+(b-a)+"% - 4px)",title:it.title+" · "+fmt(it.start)+" to "+fmt(addDays(end,-1))}))}
  }
  var r=h("div",{class:"grow"},btn,track);
  if(open)r.append(detail(it,late));
  return r;
}

function field(k,node,wide){return h("div",{class:"f"+(wide?" wide":"")},h("span",{class:"k"},k),node)}
function detail(it,late){
  var id=it.id,early=weeksEarly(it);
  var fields=h("div",{class:"fields"},
    field("Title",ed(it.title,function(v){it.title=v},{label:"title",id:id+"-title",required:true,block:true}),true),
    field("Owner",ed(it.owner,function(v){it.owner=v},{label:"owner",id:id+"-owner",ph:"Add an owner"})),
    field("Status",ed(it.status,function(v){it.status=v;it.done=v==="done"?TODAY:""},{label:"status",id:id+"-status",type:"select",options:STATUS,fmt:sLabel})),
    field(it.ms?"Date":"Starts",ed(it.start,function(v){moveStart(it,diff(v,it.start))},{label:"start date",id:id+"-start",type:"date",fmt:function(v){return fmt(v)}})),
    it.ms?null:field("Length",ed(it.weeks,function(v){setWeeks(it,v)},{label:"length in weeks",id:id+"-weeks",type:"number",min:1,fmt:function(v){return v+(v===1?" week":" weeks")}})),
    it.ms?null:field("Ends",h("span",null,fmt(addDays(endOf(it),-1)))),
    it.done?field("Marked done",h("span",null,fmt(it.done))):null,
    field("Workstream",ed(it.lane,function(v){it.lane=v},{label:"workstream",id:id+"-lane",type:"select",options:state.lanes.map(function(l){return [l.id,l.name]}),fmt:function(v){var l=state.lanes.filter(function(x){return x.id===v})[0];return l?l.name:v}})),
    field("Notes",ed(it.note,function(v){it.note=v},{label:"notes",id:id+"-note",multi:true,block:true,ph:"Add a note"}),true));
  function act(label,fn){return h("button",{class:"btn sm",type:"button",onclick:function(){fn();commit()}},label)}
  var moves=h("div",{class:"bar-row"},
    act("Start 1 wk earlier",function(){moveStart(it,-7)}),
    act("Start 1 wk later",function(){moveStart(it,7)}),
    it.ms?null:act("1 wk shorter",function(){setWeeks(it,it.weeks-1)}),
    it.ms?null:act("1 wk longer",function(){setWeeks(it,it.weeks+1)}),
    it.status!=="done"?act(it.ms?"Mark reached":"Mark done",function(){it.status="done";it.done=TODAY}):null,
    act(it.ms?"Make it a work item":"Make it a milestone",function(){it.ms=!it.ms;it.weeks=it.ms?0:1}),
    confirmDel===id
      ?h("span",{class:"grp"},h("span",{class:"muted"},"Delete this item?"),
          h("button",{class:"btn sm danger",type:"button",onclick:function(){state.items=state.items.filter(function(o){return o!==it});delete ui.open[id];confirmDel="";saveUi();commit()}},"Delete"),
          h("button",{class:"btn sm",type:"button",onclick:function(){confirmDel="";render()}},"Keep"))
      :h("button",{class:"btn sm danger",type:"button",onclick:function(){confirmDel=id;render()}},"Delete"));
  var hints=[];
  if(late)hints.push(h("p",{class:"muted"},(it.ms?"This milestone date has passed.":"This item was due to finish by "+fmt(addDays(endOf(it),-1))+".")+" Move it, make it longer, or mark it done."));
  if(early>0)hints.push(h("div",{class:"bar-row"},h("span",{class:"muted"},"Finished "+early+(early===1?" week":" weeks")+" early."),
    h("button",{class:"btn sm ink",type:"button",onclick:function(){setWeeks(it,it.weeks-early,true);commit()}},"Pull "+(it.owner||"this owner")+"'s later items "+early+" wk earlier")));
  return h("div",{class:"detail"},fields,hints,moves);
}

function noteList(key,title,hint){
  var arr=state.notes[key]||(state.notes[key]=[]);
  var ul=h("ul",{class:"list"},arr.map(function(t,i){
    return h("li",null,
      ed(t,function(v){arr[i]=v},{label:title+" point",id:key+"-"+i,multi:true,block:true,ph:"Write here"}),
      h("button",{class:"x",type:"button","aria-label":"Remove this point",title:"Remove",onclick:function(){arr.splice(i,1);commit()}},"×"));
  }));
  return h("section",null,h("h2",null,title),hint?h("p",{class:"muted"},hint):null,arr.length?ul:null,
    h("div",null,h("button",{class:"btn sm",type:"button",onclick:function(){arr.push("");commit()}},"Add a point")));
}
function notes(){
  return h("div",{class:"cols"},
    noteList("today","Where the product stands","From a read of the repository on 18 November 2026."),
    noteList("assumptions","Assumptions behind the dates",""),
    noteList("decisions","Decisions still open",""));
}

function dataTools(){
  var box=null;
  if(dataBox){
    var ta=h("textarea",{id:"data-text",rows:6,"aria-label":"Roadmap data"});
    ta.value=dataBox==="copy"?JSON.stringify(state):"";
    box=h("div",{style:"display:flex;flex-direction:column;gap:8px"},
      h("p",{class:"muted"},dataBox==="copy"?"Copy this text and keep it somewhere safe.":"Paste a saved copy below, then choose Load."),ta,
      h("div",{class:"grp"},
        dataBox==="load"?h("button",{class:"btn sm ink",type:"button",onclick:function(){
          var d=null;try{d=JSON.parse(ta.value)}catch(e){}
          if(!valid(d)){ta.setCustomValidity("x");ta.style.borderColor="var(--bad)";return}
          state=d;dataBox="";commit()}},"Load"):null,
        h("button",{class:"btn sm",type:"button",onclick:function(){dataBox="";render()}},"Close")));
    if(dataBox==="copy")setTimeout(function(){ta.focus();ta.select()},0);
  }
  return h("section",null,h("h2",null,"Your data"),
    h("p",{class:"muted",style:"max-width:78ch"},"Every edit is saved as you make it. On the published page the plan is kept with the page. Opened as a file, it is kept in this browser only, so keep a copy if it matters."),
    h("div",{class:"bar-row"},
      h("button",{class:"btn",type:"button",onclick:function(){
        var t=JSON.stringify(state);
        var fail=function(){dataBox="copy";render()};
        try{navigator.clipboard.writeText(t).then(function(){setSync("Copied the roadmap data to the clipboard.")},fail)}catch(e){fail()}}},"Copy a backup"),
      h("button",{class:"btn",type:"button",onclick:function(){dataBox="load";render()}},"Load a backup"),
      confirmReset
        ?h("span",{class:"grp"},h("span",{class:"muted"},"Replace everything with the starting plan?"),
            h("button",{class:"btn danger",type:"button",onclick:function(){state=clone(SEED);confirmReset=false;commit()}},"Reset"),
            h("button",{class:"btn",type:"button",onclick:function(){confirmReset=false;render()}},"Keep my changes"))
        :h("button",{class:"btn danger",type:"button",onclick:function(){confirmReset=true;render()}},"Reset to the starting plan")),
    box);
}

render();
connect();
})();
</script>
