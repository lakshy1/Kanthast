<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanthast | Learn Medicine Through Immersive Animations</title>
    <meta name="description" content="Master USMLE, NEET PG and INI CET through immersive 3D animations and visual learning. Start for free." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://kanthast.in/" />

    <!-- SEO -->
    <meta name="google-site-verification" 
    content="pt2_giWqmJ_J086kdvsFNyI9VaNS4pJODhsz7rvf9fk" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#0B1120" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kanthast" />
    <meta property="og:title" content="Kanthast | Learn Medicine Through Immersive Animations" />
    <meta property="og:description" content="Master USMLE, NEET PG and INI CET through immersive 3D animations and visual learning. Start for free." />
    <meta property="og:url" content="https://kanthast.in/" />
    <meta property="og:image" content="https://kanthast.in/Banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kanthast | Learn Medicine Through Immersive Animations" />
    <meta name="twitter:description" content="Master USMLE, NEET PG and INI CET through immersive 3D animations and visual learning." />
    <meta name="twitter:image" content="https://kanthast.in/Banner.png" />

    <!-- Structured Data: Organization + WebSite + SiteNavigation -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://kanthast.in/#organization",
          "name": "Kanthast",
          "url": "https://kanthast.in",
          "logo": {
            "@type": "ImageObject",
            "url": "https://kanthast.in/logo.png"
          },
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://kanthast.in/#website",
          "url": "https://kanthast.in",
          "name": "Kanthast",
          "publisher": { "@id": "https://kanthast.in/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://kanthast.in/courses?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "SiteNavigationElement",
          "@id": "https://kanthast.in/#navigation",
          "name": ["Courses", "About", "Contact", "Log In", "Sign Up"],
          "url": [
            "https://kanthast.in/courses",
            "https://kanthast.in/about",
            "https://kanthast.in/contact",
            "https://kanthast.in/login",
            "https://kanthast.in/signup"
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
